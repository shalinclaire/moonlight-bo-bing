<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#681817">
  <meta name="description" content="六颗骰子落玉盘，来博一个中秋好彩头。">
  <title>月下博饼｜中秋好运一掷</title>
  <link rel="preload" href="./dice-flip-trimmed.mp3?v=20260916-18" as="audio" type="audio/mpeg">
  <link rel="stylesheet" href="./styles.css?v=20260921-25">
</head>
<body>
<main>
  <header class="topbar"><div class="brand"><span>博</span><strong>月下博饼</strong></div><button class="user-chip" id="user-chip" type="button"><span>参与者</span><strong id="user-name">填写昵称</strong></button></header>
  <section class="hero">
    <div class="intro"><p class="eyebrow">MOONLIGHT BO BING</p><h1><span>今宵月满</span><em>博个好彩</em><i class="title-die" aria-label="六点骰子"><b></b><b></b><b></b><b></b><b></b><b></b></i></h1><p class="lede">六子落玉盘，一掷定好彩。<br>点击按钮，听一场属于中秋的清脆回响。</p><div class="legend"><span>闽南中秋传统民俗</span><i></i><span>六骰雅玩</span></div></div>
    <div aria-hidden="true" class="game-spacer" style="height:140px;flex:0 0 140px"></div>
    <div class="game" id="game" aria-live="polite">
      <div class="moon" id="moon"></div>
      <div class="bowl-wrap"><img class="bowl-image bowl-front" src="./bobing-bowl-transparent.webp?v=20260916-5" alt="红色花纹博饼瓷碗"><img class="bowl-image bowl-top" src="./bobing-bowl-top-transparent.webp?v=20260916-5" alt="俯视红色花纹博饼瓷碗"><div class="dice-stage" id="dice-stage"></div></div>
      <div class="result" id="result"><span>静候开博</span><strong>月圆 · 人团圆</strong><p>按下按钮，让骰子替你问一程好运</p></div>
      <button id="roll" class="roll-btn"><span>开始博饼</span><b>掷</b></button><small>点击按钮或按空格键</small>
      <section class="winner-board" aria-label="最新中奖记录">
        <header><strong>最新中奖</strong><span>实时更新</span></header>
        <div class="winner-window"><div class="winner-list" id="winner-list"><p class="winner-empty">等待第一份好彩</p></div></div>
      </section>
    </div>
  </section>
  <section class="rules" aria-labelledby="rules-title">
    <div class="rules-head"><p>HOW TO PLAY</p><h2 id="rules-title">传统博饼规则</h2><span>六颗骰子落定，对照红四与相同点数组合判定彩头</span></div>
    <div class="rule-grid" id="rule-grid"></div>
    <p class="rules-note">各地博饼细则略有差异，本页面采用常见的闽南六骰玩法</p>
  </section>
  <footer><span>海上生明月</span><i>✦</i><span>天涯共此时</span></footer>
</main>
<div class="name-modal" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="name-title">
  <form class="name-card" id="name-form">
    <span class="name-kicker">参与登记</span>
    <h2 id="name-title">填写参与信息</h2>
    <p>用于记录本次博饼结果及店铺统计，填写一次后会保存在当前设备。</p>
    <label for="nickname">姓名或昵称</label>
    <input id="nickname" name="nickname" maxlength="30" autocomplete="name" placeholder="请输入姓名或昵称" required>
    <label for="phone">手机号码</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" pattern="1[3-9][0-9]{9}" placeholder="请输入11位手机号码" required>
    <label for="shop-code">店铺编码</label>
    <input id="shop-code" name="shop_code" maxlength="30" autocomplete="off" autocapitalize="characters" placeholder="请输入店铺编码" required>
    <button type="submit">确认并开始博饼</button>
  </form>
</div>
<div class="record-toast" id="record-toast" role="status"></div>
<script src="./script.js?v=20260921-25"></script>
</body>
</html>
